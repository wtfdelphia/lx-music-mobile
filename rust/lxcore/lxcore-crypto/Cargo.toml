[package]
name = "lxcore-crypto"
version = "0.1.0"
edition = "2021"
description = "LX Music Mobile 加密核心：与 Android AES.java/RSA.java 字节级对齐（openspec change: add-ios-support）"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["sha1", "hazmat"] }
sha1 = "0.10"
rand = "0.8"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
