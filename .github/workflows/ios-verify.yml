name: iOS Verify

on:
  push:
    branches:
      - master
      - dev-ios
    paths:
      - 'ios/**'
      - 'rust/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'index.js'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/ios-verify.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'rust/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'index.js'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/ios-verify.yml'

jobs:
  js-verify:
    name: JS 门禁（单测 + Metro 双端打包）
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: 单元测试（黄金基准文件完整性）
        run: npm test

      - name: Metro 打包（iOS / Android）
        run: |
          npx react-native bundle --platform ios --dev false --entry-file index.js \
            --bundle-output /tmp/index.ios.bundle --assets-dest /tmp/lxm-assets-ios
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output /tmp/index.android.bundle --assets-dest /tmp/lxm-assets-android

  rust-ios-target:
    name: Rust iOS target 交叉编译
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 staticlib（aarch64-apple-ios）
        working-directory: rust/lxcore
        run: cargo build --locked --release --target aarch64-apple-ios

      - name: 构建 staticlib（模拟器切片）
        working-directory: rust/lxcore
        run: cargo build --locked --release --target aarch64-apple-ios-sim --target x86_64-apple-ios

      - name: macOS 宿主黄金基准
        working-directory: rust/lxcore
        run: cargo test --locked

  ios-build:
    name: iOS unsigned 构建（设备 / IPA）
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: pod install（关 Flipper）
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 lxcore staticlib（iOS）
        run: bash rust/build-ios-libs.sh

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          pod --version

      - name: unsigned 构建（设备）
        working-directory: ios
        run: >
          xcodebuild
          -workspace LxMusicMobile.xcworkspace
          -scheme LxMusicMobile
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: 打包 IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir Payload
          cp -r LxMusicMobile.app Payload/
          zip -qry LxMusicMobile-unsigned.ipa Payload

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicMobile-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/LxMusicMobile-unsigned.ipa
          retention-days: 30

  ios-simulator-smoke:
    name: iOS 模拟器冒烟（启动到首页）
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: pod install（关 Flipper）
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 lxcore staticlib（iOS）
        run: bash rust/build-ios-libs.sh

      - name: Release 构建（模拟器）
        working-directory: ios
        run: >
          xcodebuild
          -workspace LxMusicMobile.xcworkspace
          -scheme LxMusicMobile
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: 启动模拟器并运行 App
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '\([0-9A-F-]{36}\)' | tr -d '()')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" LxMusicMobile.app
          xcrun simctl launch --console-pty "$UDID" cn.toside.music.mobile > console.log 2>&1 &
          LAUNCH_PID=$!
          sleep 90
          kill "$LAUNCH_PID" 2>/dev/null || true
          xcrun simctl io "$UDID" screenshot screenshot.png || true
          echo '--- console tail ---'
          tail -n 60 console.log
          pgrep -x LxMusicMobile > /dev/null && echo "APP_RUNNING_AT_90S" || echo "APP_GONE_AT_90S"

      - name: 深链探针（lxmusic:// 到达验证）
        run: |
          UDID=$(xcrun simctl list devices booted | grep -oE '\([0-9A-F-]{36}\)' | head -1 | tr -d '()')
          cd ios/build/Build/Products/Release-iphonesimulator
          echo "Deep link probe on $UDID"
          pgrep -x LxMusicMobile > /dev/null && echo "APP_ALIVE_PRE_PROBE" || echo "APP_DEAD_PRE_PROBE"
          xcrun simctl openurl "$UDID" "lxmusic://player/pause" || echo "OPENURL_FAILED_PAUSE"
          sleep 8
          xcrun simctl openurl "$UDID" "lxmusic:///tmp/lx-ci-probe.lxmc" || echo "OPENURL_FAILED_FILE"
          sleep 12
          xcrun simctl io "$UDID" screenshot deeplink.png || true
          pgrep -x LxMusicMobile > /dev/null && echo "APP_ALIVE_POST_PROBE" || echo "APP_DEAD_POST_PROBE"

      - name: 采集统一日志（含 JS console / preload 痕迹）
        run: |
          UDID=$(xcrun simctl list devices booted | grep -oE '\([0-9A-F-]{36}\)' | head -1 | tr -d '()')
          cd ios/build/Build/Products/Release-iphonesimulator
          # 宿主侧 log show：模拟器 App 以宿主进程运行；此前 simctl spawn 路线
          # 因 CI 无 uid 501 用户上下文而失败（getpwuid_r）
          log show --last 10m --predicate 'process == "LxMusicMobile"' --style compact > unified.log 2>&1 || true
          CONTAINER=$(xcrun simctl get_app_container "$UDID" cn.toside.music.mobile data 2>/dev/null || true)
          echo "App container: ${CONTAINER:-UNKNOWN}"
          if [ -n "$CONTAINER" ]; then
            { echo '== sandbox tree =='; find "$CONTAINER" -type f | head -50; } > sandbox-logs.txt 2>&1 || true
            find "$CONTAINER" -name '*.log' -exec sh -c 'echo; echo "== $1 =="; cat "$1"' _ {} \; >> sandbox-logs.txt 2>&1 || true
            echo '== preferences ==' >> sandbox-logs.txt
            ls -la "$CONTAINER/Library/Preferences/" >> sandbox-logs.txt 2>&1 || true
            for p in "$CONTAINER/Library/Preferences/"*.plist; do
              [ -f "$p" ] || continue
              { echo; echo "== $p =="; plutil -p "$p"; } >> sandbox-logs.txt 2>&1 || true
            done
          fi
          echo '--- unified log 关键行 ---'
          grep -E 'starting app|Preload|deeplink|lx_|Exception|crash' unified.log | tail -n 100 || true

      - name: 上传冒烟证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: |
            ios/build/Build/Products/Release-iphonesimulator/console.log
            ios/build/Build/Products/Release-iphonesimulator/screenshot.png
            ios/build/Build/Products/Release-iphonesimulator/deeplink.png
            ios/build/Build/Products/Release-iphonesimulator/unified.log
            ios/build/Build/Products/Release-iphonesimulator/sandbox-logs.txt
          retention-days: 30

  android-regression:
    name: Android release 回归（preload 入包校验）
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: 生成一次性签名
        working-directory: android/app
        run: >
          keytool -genkeypair -v -storetype PKCS12
          -keystore ci-release.keystore -storepass cipass -keypass cipass
          -alias ci -keyalg RSA -keysize 2048 -validity 10
          -dname "CN=CI Regression, OU=CI, O=CI, L=CI, S=CI, C=CN"

      - name: Gradle assembleRelease
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PMYAPP_UPLOAD_STORE_FILE=ci-release.keystore
          -PMYAPP_UPLOAD_STORE_PASSWORD=cipass
          -PMYAPP_UPLOAD_KEY_ALIAS=ci
          -PMYAPP_UPLOAD_KEY_PASSWORD=cipass

      - name: 校验 preload 入包
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*universal*release.apk' | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1); fi
          echo "APK: $APK"
          unzip -l "$APK" | grep 'assets/script/user-api-preload.js' || { echo "PRELOAD_NOT_IN_APK"; exit 1; }
