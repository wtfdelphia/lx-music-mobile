name: iOS Verify

on:
  push:
    branches:
      - master
      - dev-ios
    paths:
      - 'ios/**'
      - 'rust/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-verify.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'rust/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-verify.yml'

jobs:
  rust-ios-target:
    name: Rust iOS target 交叉编译
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 构建 staticlib（aarch64-apple-ios）
        working-directory: rust/lxcore
        run: cargo build --locked --release --target aarch64-apple-ios

      - name: macOS 宿主黄金基准
        working-directory: rust/lxcore
        run: cargo test --locked

  ios-build:
    name: iOS unsigned 构建（设备 / IPA）
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: pod install（关 Flipper）
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 构建 lxcore staticlib（iOS）
        run: bash rust/build-ios-libs.sh

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          pod --version

      - name: unsigned 构建（设备）
        working-directory: ios
        run: >
          xcodebuild
          -workspace LxMusicMobile.xcworkspace
          -scheme LxMusicMobile
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: 打包 IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir Payload
          cp -r LxMusicMobile.app Payload/
          zip -qry LxMusicMobile-unsigned.ipa Payload

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicMobile-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/LxMusicMobile-unsigned.ipa
          retention-days: 30
