name: iOS Verify

on:
  push:
    branches:
      - master
      - dev-ios
    paths:
      - 'ios/**'
      - 'rust/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'index.js'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/ios-verify.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'rust/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'index.js'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/ios-verify.yml'

jobs:
  js-verify:
    name: JS 门禁（单测 + Metro 双端打包）
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: 单元测试（黄金基准文件完整性）
        run: npm test

      - name: Metro 打包（iOS / Android）
        run: |
          npx react-native bundle --platform ios --dev false --entry-file index.js \
            --bundle-output /tmp/index.ios.bundle --assets-dest /tmp/lxm-assets-ios
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output /tmp/index.android.bundle --assets-dest /tmp/lxm-assets-android

  rust-ios-target:
    name: Rust iOS target 交叉编译
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 staticlib（aarch64-apple-ios）
        working-directory: rust/lxcore
        run: cargo build --locked --release --target aarch64-apple-ios

      - name: 构建 staticlib（模拟器切片）
        working-directory: rust/lxcore
        run: cargo build --locked --release --target aarch64-apple-ios-sim --target x86_64-apple-ios

      - name: macOS 宿主黄金基准
        working-directory: rust/lxcore
        run: cargo test --locked

  ios-build:
    name: iOS unsigned 构建（设备 / IPA）
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: pod install（关 Flipper）
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 lxcore staticlib（iOS）
        run: bash rust/build-ios-libs.sh

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          pod --version

      - name: unsigned 构建（设备）
        working-directory: ios
        run: >
          xcodebuild
          -workspace LxMusicMobile.xcworkspace
          -scheme LxMusicMobile
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: 打包 IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir Payload
          cp -r LxMusicMobile.app Payload/
          zip -qry LxMusicMobile-unsigned.ipa Payload

      - name: 上传 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: LxMusicMobile-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/LxMusicMobile-unsigned.ipa
          retention-days: 30

  ios-simulator-smoke:
    name: iOS 模拟器冒烟（启动到首页）
    runs-on: macos-15
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: pod install（关 Flipper）
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 lxcore staticlib（iOS）
        run: bash rust/build-ios-libs.sh

      - name: Release 构建（模拟器）
        working-directory: ios
        run: >
          xcodebuild
          -workspace LxMusicMobile.xcworkspace
          -scheme LxMusicMobile
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: 启动模拟器并安装（写入自测标记）
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          # 钉死模拟器 runtime：head -1 跟随镜像预装列表，镜像更换时 25 项
          # 自测的绿灯含义会静默漂移（见 docs/ios-multi-version-plan.md §2.1）。
          # 找不到目标 runtime 必须失败退出——静默回退等于把洞换个地方开
          RUNTIME="18.5"
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices
            const want = process.argv[1]
            const key = Object.keys(d).find(k => k.includes(want.replace(/\./g, "-")))
            if (!key) { console.error("FATAL: simulator runtime not found: " + want); process.exit(1) }
            const dev = d[key].find(x => x.name.startsWith("iPhone") && x.isAvailable)
            if (!dev) { console.error("FATAL: no available iPhone in runtime " + key); process.exit(1) }
            console.error("selected runtime: " + key + " device: " + dev.name)
            process.stdout.write(dev.udid)
          ' "$RUNTIME")
          [ -n "$UDID" ] || { echo "FATAL: simulator selection failed"; exit 1; }
          echo "Simulator: $UDID (iOS $RUNTIME)"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "IOS_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" LxMusicMobile.app
          # 自测标记 + 文件深链探针：须在 launch 前写入（install 后容器目录已存在）
          CONTAINER=$(xcrun simctl get_app_container "$UDID" cn.toside.music.mobile data)
          echo "CONTAINER=$CONTAINER" >> "$GITHUB_ENV"
          mkdir -p "$CONTAINER/tmp"
          # runtime 标识投递应用沙箱：自测报告 env.ciRuntime 回带，
          # 宿主断言端核对「钉死目标 == 实际执行环境」
          echo "iOS $RUNTIME" > "$CONTAINER/tmp/lx-ci-runtime"
          touch "$CONTAINER/tmp/.lx-ci-selftest"
          echo 'lx-ci probe lxmc' > "$CONTAINER/tmp/lx-ci-probe.lxmc"
          # 任务 2.3 一键入口：回归脚本 + 断言清单投递沙箱，
          # 应用内 user_api_regression 用例逐个跑 加载→inited
          cp "$GITHUB_WORKSPACE"/test/scripts-regression/candidates/*.js "$CONTAINER/tmp/"
          cp "$GITHUB_WORKSPACE"/test/scripts-regression/ci-expect.json "$CONTAINER/tmp/lx-ci-regression-manifest.json"
          # CI 夹具：确定性本地音源（起播/后台续播，零外网依赖）+ 封面图（锁屏元数据）
          cp "$GITHUB_WORKSPACE/test/fixtures/lx-ci-song.wav" "$CONTAINER/tmp/"
          cp "$GITHUB_WORKSPACE/test/fixtures/lx-ci-pic.png" "$CONTAINER/tmp/"
          xcrun simctl launch "$UDID" cn.toside.music.mobile | tee launch.txt
          APP_PID=$(grep -oE '[0-9]+' launch.txt | head -1 || true)
          echo "$APP_PID" > app-pid.txt
          echo "App PID: ${APP_PID:-UNKNOWN}"

      - name: 首页取证（启动到首页）
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          APP_PID=$(cat app-pid.txt 2>/dev/null || true)
          sleep 10
          xcrun simctl io "$UDID" screenshot screenshot-early.png || true
          { echo '--- process check @10s ---'
            [ -n "$APP_PID" ] && { kill -0 "$APP_PID" 2>/dev/null && echo "PID_ALIVE" || echo "PID_DEAD"; }
            pgrep -l LxMusicMobile || echo "PGREP_NO_MATCH"; } | tee proc-10s.txt
          sleep 15
          xcrun simctl io "$UDID" screenshot screenshot-home.png || true
          { echo '--- process check @25s ---'
            [ -n "$APP_PID" ] && { kill -0 "$APP_PID" 2>/dev/null && echo "PID_ALIVE" || echo "PID_DEAD"; }
            pgrep -l LxMusicMobile || echo "PGREP_NO_MATCH"; } | tee proc-25s.txt

      - name: Tab 截图握手（应用内标记文件驱动）
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          for id in nav_search nav_songlist nav_love nav_setting; do
            marker="$CONTAINER/tmp/lx-ci-tab-$id"
            ok=0
            for i in $(seq 1 90); do [ -f "$marker" ] && { ok=1; break; }; sleep 2; done
            echo "tab marker $id: $([ "$ok" = 1 ] && echo READY || echo TIMEOUT)"
            xcrun simctl io "$UDID" screenshot "tab-$id.png" || true
            rm -f "$marker"
          done

      - name: 深链探针（等待 Tab 阶段结束后发送）
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          tabs_done="$CONTAINER/tmp/lx-ci-tabs-done"
          for i in $(seq 1 30); do [ -f "$tabs_done" ] && break; sleep 2; done
          echo "tabs-done marker: $([ -f "$tabs_done" ] && echo YES || echo NO)"
          # 任务 6.8 深色跟随：Tab 阶段结束后切设备外观为 dark，
          # 应用内 auto_theme 用例轮询 Appearance 翻转与主题 isDark
          xcrun simctl ui "$UDID" appearance dark 2>&1 || echo "APPEARANCE_SWITCH_FAILED"
          APP_PID=$(cat app-pid.txt 2>/dev/null || true)
          { echo '--- process check pre-probe ---'
            [ -n "$APP_PID" ] && { kill -0 "$APP_PID" 2>/dev/null && echo "PID_ALIVE" || echo "PID_DEAD"; }
            pgrep -l LxMusicMobile || echo "PGREP_NO_MATCH"; } | tee proc-preprobe.txt
          # run 32834027405/32836063520 实锤：iOS 18.5 模拟器上
          # `simctl openurl` 对自定义 scheme 静默吞件（前台直发与后台
          # 唤醒均成功返回、AppDelegate 零收件），file:// 文档通道正常。
          # lxmusic:// 全链路改由应用内 Linking.openURL 自投递验证；
          # 宿主保留对照组 + 假 scheme 诊断（判别 simctl 是否校验路由）。
          { echo "--- openurl lxmusic (simctl control) ---"
            xcrun simctl openurl "$UDID" "lxmusic://player/pause" 2>&1 || echo "OPENURL_FAILED_FG"
            echo "--- openurl bogus scheme (routing diagnostic) ---"
            xcrun simctl openurl "$UDID" "lxcibogus://probe" 2>&1 || echo "BOGUS_OPENURL_FAILED"
            sleep 3
            # 文件导入走 file:// 分支（runLinkAction 对非 lxmusic:// 才进 handleFileAction）
            echo "--- openurl file://probe.lxmc ---"
            xcrun simctl openurl "$UDID" "file://$CONTAINER/tmp/lx-ci-probe.lxmc" 2>&1 || echo "OPENURL_FAILED_FILE"; } | tee openurl-probe.log
          sleep 3
          xcrun simctl io "$UDID" screenshot deeplink.png || true
          cp "$CONTAINER/tmp/lx-ci-openurl.log" openurl-native.log 2>/dev/null || echo "NO_NATIVE_OPENURL_LOG"
          # 通知应用内自测：探针已发送，可进入报告阶段
          touch "$CONTAINER/tmp/.lx-ci-probe-sent"

      - name: 后台续播阶段（标记握手：起播就绪→切后台→采样→唤回）
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          bg_ready="$CONTAINER/tmp/lx-ci-bg-ready"
          bg_done="$CONTAINER/tmp/lx-ci-bg-done"
          { echo "--- background phase ---"
            ok=0
            # bg-ready 在播放恢复后数秒内写出；60s 未出现即永远不会出现。
            # 轮询窗口必须短于应用侧横屏用例的等相位窗口（180s），
            # 否则后台用例提前失败时横屏相位失步（run 32982319768 实证）
            for i in $(seq 1 30); do [ -f "$bg_ready" ] && { ok=1; break; }; sleep 2; done
            echo "bg-ready marker: $([ "$ok" = 1 ] && echo READY || echo TIMEOUT)"
            [ "$ok" = 1 ] || exit 0
            # 把前台切到系统设置，应用进入后台（音频后台模式应续播）
            xcrun simctl launch "$UDID" com.apple.Preferences 2>&1 || echo "BG_LAUNCH_FAILED"
            ok=0
            for i in $(seq 1 90); do [ -f "$bg_done" ] && { ok=1; break; }; sleep 2; done
            echo "bg-done marker: $([ "$ok" = 1 ] && echo DONE || echo TIMEOUT)"
            # 唤回前台（simctl launch 对后台挂起进程即激活）
            xcrun simctl launch "$UDID" cn.toside.music.mobile | tee launch-bg.txt
            grep -oE '[0-9]+' launch-bg.txt | head -1 > app-pid.txt || true; } | tee bg-phase.log

      - name: 横屏阶段（标记握手：应用内驱动旋转，宿主截图取证）
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          rotate_phase="$CONTAINER/tmp/lx-ci-rotate-phase"
          shot="$CONTAINER/tmp/lx-ci-landscape-shot"
          { echo "--- landscape phase ---"
            # 先无条件唤回前台：横屏用例断言的是窗口尺寸翻转，而 RN 不会
            # 给非 active 的场景重排版——scene 停在 inactive 时旋转请求会被
            # 接受（interfaceOrientation 已报 landscape、geoErrors 为空）但
            # 画面不转，Dimensions 不发变更、onLayout 不触发，断言必失败
            # （run 33144095295：rot.ok=1 且 interfaceOrientationAfter2s
            # =landscape，windowSizeTools 仍是 402x874，截图 1206x2622 竖屏）。
            # 上游的后台阶段在 bg-ready TIMEOUT 时 exit 0 早退，其末尾的唤回
            # launch 不执行，场景就一路 inactive 带进本阶段。此处 launch 幂等：
            # 应用已在前台时仅激活，不重启进程（自测状态与报告不丢）
            xcrun simctl launch "$UDID" cn.toside.music.mobile 2>&1 || echo "ROTATE_WAKE_FAILED"
            sleep 3
            echo "landscape $(date +%s)" > "$rotate_phase"
            ok=0
            for i in $(seq 1 90); do [ -f "$shot" ] && { ok=1; break; }; sleep 2; done
            echo "landscape-shot marker: $([ "$ok" = 1 ] && echo READY || echo TIMEOUT)"
            echo "shot content: $(cat "$shot" 2>/dev/null || echo '<none>')"
            xcrun simctl io "$UDID" screenshot landscape.png || echo "LANDSCAPE_SHOT_FAILED"
            rm -f "$shot"
            # 等应用复原竖屏（应用复原后删除 rotate-phase）
            ok=0
            for i in $(seq 1 45); do [ ! -f "$rotate_phase" ] && { ok=1; break; }; sleep 2; done
            echo "portrait restored: $([ "$ok" = 1 ] && echo YES || echo TIMEOUT)"; } | tee landscape-phase.log

      - name: 采集自测报告并断言
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          REPORT="$CONTAINER/tmp/lx-ci-report.json"
          DONE="$CONTAINER/tmp/lx-ci-done"
          APP_PID=$(cat app-pid.txt 2>/dev/null || true)
          ok=0
          # 等套件完成标记（应用每用例增量落盘部分报告，报告文件存在
          # 不再是完成信号；lx-ci-done 仅在套件跑完时写）。应用进程
          # 崩溃则提前退出轮询——部分报告 + 崩溃文件即完整取证面
          for i in $(seq 1 288); do
            [ -f "$DONE" ] && { ok=1; break; }
            if [ -n "$APP_PID" ] && ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "app PID $APP_PID died at poll $i - breaking wait"
              break
            fi
            sleep 5
          done
          echo "suite done marker: $ok"
          [ -f "$REPORT" ] && cp "$REPORT" ci-report.json
          { echo '--- process check final ---'
            [ -n "$APP_PID" ] && { kill -0 "$APP_PID" 2>/dev/null && echo "PID_ALIVE" || echo "PID_DEAD"; }
            pgrep -l LxMusicMobile || echo "PGREP_NO_MATCH"; } | tee proc-final.txt
          # 崩溃报告采集（run 32995785233 最大信息缺口）：.ips 全文进
          # artifact，异常类型 + 崩溃线程栈摘要直接进日志
          crash_count=0
          for ips in ~/Library/Logs/DiagnosticReports/*LxMusicMobile*.ips; do
            [ -f "$ips" ] || continue
            crash_count=$((crash_count + 1))
            cp "$ips" "crash-${crash_count}.ips"
            echo "=== crash report $crash_count: $ips ==="
            node "$GITHUB_WORKSPACE/test/crash-summary.js" "$ips" || true
          done
          echo "crash reports collected: $crash_count"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i lxmusic || echo "NO_CRASH_REPORTS"
          node "$GITHUB_WORKSPACE/test/ci-report-assert.js" ci-report.json \
            tab-nav_search.png tab-nav_songlist.png tab-nav_love.png tab-nav_setting.png

      - name: 上传冒烟证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-smoke
          path: |
            ios/build/Build/Products/Release-iphonesimulator/launch.txt
            ios/build/Build/Products/Release-iphonesimulator/proc-*.txt
            ios/build/Build/Products/Release-iphonesimulator/screenshot-*.png
            ios/build/Build/Products/Release-iphonesimulator/tab-*.png
            ios/build/Build/Products/Release-iphonesimulator/deeplink.png
            ios/build/Build/Products/Release-iphonesimulator/landscape.png
            ios/build/Build/Products/Release-iphonesimulator/bg-phase.log
            ios/build/Build/Products/Release-iphonesimulator/landscape-phase.log
            ios/build/Build/Products/Release-iphonesimulator/launch-bg.txt
            ios/build/Build/Products/Release-iphonesimulator/ci-report.json
            ios/build/Build/Products/Release-iphonesimulator/openurl-probe.log
            ios/build/Build/Products/Release-iphonesimulator/openurl-native.log
            ios/build/Build/Products/Release-iphonesimulator/crash-*.ips
          retention-days: 30

  android-regression:
    name: Android release 回归（preload 入包校验）
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: 生成一次性签名
        working-directory: android/app
        run: >
          keytool -genkeypair -v -storetype PKCS12
          -keystore ci-release.keystore -storepass cipass -keypass cipass
          -alias ci -keyalg RSA -keysize 2048 -validity 10
          -dname "CN=CI Regression, OU=CI, O=CI, L=CI, S=CI, C=CN"

      - name: Gradle assembleRelease
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PMYAPP_UPLOAD_STORE_FILE=ci-release.keystore
          -PMYAPP_UPLOAD_STORE_PASSWORD=cipass
          -PMYAPP_UPLOAD_KEY_ALIAS=ci
          -PMYAPP_UPLOAD_KEY_PASSWORD=cipass

      - name: 校验 preload 入包
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*universal*release.apk' | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1); fi
          echo "APK: $APK"
          unzip -l "$APK" | grep 'assets/script/user-api-preload.js' || { echo "PRELOAD_NOT_IN_APK"; exit 1; }
