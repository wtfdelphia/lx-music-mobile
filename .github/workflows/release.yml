name: Build

on:
  push:
    branches:
      - main

jobs:
  CheckVersion:
    name: CheckVersion
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether version tag exists
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if git tag -l "v${PACKAGE_VERSION}" | grep -q .; then
            echo "Tag v${PACKAGE_VERSION} already exists, skip release"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  Android:
    name: Android
    runs-on: ubuntu-latest
    needs: [CheckVersion]
    if: needs.CheckVersion.outputs.should_run == 'true'
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Packages
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          echo ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }} | base64 --decode > app/${{ secrets.KEYSTORE_STORE_FILE }}
          ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE='${{ secrets.KEYSTORE_STORE_FILE }}' -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.KEYSTORE_KEY_ALIAS }}' -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.KEYSTORE_KEY_PASSWORD }}'
          rm -f app/${{ secrets.KEYSTORE_STORE_FILE }}

      # Push tag to GitHub if package.json version's tag is not tagged
      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Create git tag
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

  iOS:
    name: iOS
    runs-on: macos-15
    needs: [CheckVersion]
    if: needs.CheckVersion.outputs.should_run == 'true'
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: pod install（关 Flipper）
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 lxcore staticlib（iOS）
        run: bash rust/build-ios-libs.sh

      - name: unsigned 构建（设备）
        working-directory: ios
        run: >
          xcodebuild
          -workspace LxMusicMobile.xcworkspace
          -scheme LxMusicMobile
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: 打包 IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir Payload
          cp -r LxMusicMobile.app Payload/
          zip -qry lx-music-mobile-v${{ env.PACKAGE_VERSION }}-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-v${{ env.PACKAGE_VERSION }}-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-unsigned.ipa

